name: Release

# A release is made automatically when the version in src/miunlock/__init__.py changes on main
# (bump it, update CHANGELOG.md, push). Pushing a tag like v1.8.1 by hand, or running the
# workflow from the Actions tab, does the same. A version that already has a release is skipped.
on:
  push:
    branches: [main]
    paths: ["src/miunlock/__init__.py"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"',open('src/miunlock/__init__.py').read()).group(1))")
          TAG="v$V"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME != package version $TAG"; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a release: nothing to do"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  dist:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stamp the build (date and commit shown in the app)
        shell: bash
        run: printf 'DATE = "%s"\nCOMMIT = "%s"\n' "$(git log -1 --format=%cd --date=format:%d%m%Y)" "$(git rev-parse --short HEAD)" > src/miunlock/_build.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

  executables:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, tag: windows-x64, ext: .exe, mode: --windowed}
          - {os: ubuntu-24.04,  tag: linux-x64,   ext: "", mode: --console}
          - {os: macos-latest,   tag: macos-arm64, ext: "", mode: --console}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stamp the build (date and commit shown in the app)
        shell: bash
        run: printf 'DATE = "%s"\nCOMMIT = "%s"\n' "$(git log -1 --format=%cd --date=format:%d%m%Y)" "$(git rev-parse --short HEAD)" > src/miunlock/_build.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Build
        run: pyinstaller --onefile ${{ matrix.mode }} --name miunlock --icon assets/icon.ico --collect-data miunlock --collect-all libusb_package --hidden-import usb.backend.libusb1 --hidden-import PIL._tkinter_finder packaging/app.py
      - name: Smoke test
        shell: bash
        run: |
          ./dist/miunlock${{ matrix.ext }} --version
          if ./dist/miunlock${{ matrix.ext }} unlock; then echo "gate failed"; exit 1; fi
      - name: Name artifacts
        shell: bash
        run: |
          mkdir out
          cp dist/miunlock${{ matrix.ext }}     out/miunlock-${{ matrix.tag }}${{ matrix.ext }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exe-${{ matrix.tag }}
          path: out/*

  publish:
    needs: [check, dist, executables]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only this job may create the release
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums (the in-app updater checks downloads against this file)
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          V="${TAG#v}"
          awk -v h="## [$V]" 'index($0, h) == 1 {f=1; next} f && index($0, "## [") == 1 {exit} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo "- \`miunlock-*\` program for Windows, Linux and macOS: opens the GUI, or runs on the command line with \`--cli\`. The app updates itself from here (Help > Check for updates)."
            echo "- \`.whl\` / \`.tar.gz\`: Python packages (\`pip install <file>\`)"
            echo "- \`SHA256SUMS.txt\`: verify downloads with \`sha256sum -c SHA256SUMS.txt\`"
            echo
            echo "The executables are unsigned, so Windows SmartScreen and macOS Gatekeeper may warn."
            echo "Antivirus tools sometimes flag PyInstaller programs. If you prefer, install from source."
            echo "Unlocking erases the device: read docs/safety.md first."
          } >> notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" artifacts/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"

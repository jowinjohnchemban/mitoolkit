name: Release

# Push a tag like v1.8.0 to build and publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the package version
        run: |
          V=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"',open('src/miunlock/__init__.py').read()).group(1))")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package version v$V"; exit 1; }

  dist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  executables:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, tag: windows-x64, ext: .exe}
          - {os: ubuntu-latest,  tag: linux-x64,   ext: ""}
          - {os: macos-latest,   tag: macos-arm64, ext: ""}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Build CLI
        run: pyinstaller --onefile --console --name miunlock --collect-data miunlock packaging/miunlock_cli.py
      - name: Build GUI
        run: pyinstaller --onefile --windowed --name miunlock-gui --collect-data miunlock packaging/miunlock_gui.py
      - name: Smoke test
        shell: bash
        run: |
          ./dist/miunlock${{ matrix.ext }} --version
          if ./dist/miunlock${{ matrix.ext }} unlock; then echo "gate failed"; exit 1; fi
      - name: Name artifacts
        shell: bash
        run: |
          mkdir out
          cp dist/miunlock${{ matrix.ext }}     out/miunlock-${{ matrix.tag }}${{ matrix.ext }}
          cp dist/miunlock-gui${{ matrix.ext }} out/miunlock-gui-${{ matrix.tag }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.tag }}
          path: out/*

  publish:
    needs: [dist, executables]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v h="## [$V]" 'index($0, h) == 1 {f=1; next} f && index($0, "## [") == 1 {exit} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo "- \`miunlock-*\` command-line and \`miunlock-gui-*\` GUI executables for Windows, Linux and macOS"
            echo "- \`.whl\` / \`.tar.gz\`: Python packages (\`pip install <file>\`)"
            echo "- \`SHA256SUMS.txt\`: verify downloads with \`sha256sum -c SHA256SUMS.txt\`"
            echo
            echo "The executables are unsigned, so Windows SmartScreen and macOS Gatekeeper may warn."
            echo "Antivirus tools sometimes flag PyInstaller programs. If you prefer, install from source."
            echo "Unlocking erases the device: read docs/safety.md first."
          } >> notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file notes.md

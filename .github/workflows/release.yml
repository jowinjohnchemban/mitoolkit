name: Release

# Every merge to main is released automatically, with the next version worked out from what was merged
# (standard Conventional Commits + Semantic Versioning, see .github/scripts/release_version.py):
#   "feat: ..." -> minor, "type!: ..." or BREAKING CHANGE -> major, anything else -> patch.
# The git tag is the source of truth for the version: it is stamped into the build here and never committed,
# so the protected main needs no bot push. Run it by hand to force a bump (major, minor or patch).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force major, minor or patch. Leave empty to work it out from the merged pull request titles."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release              # one release at a time, so two quick merges cannot pick the same version
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the tags and the history since the last release
          persist-credentials: false
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED_BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/release_version.py ${FORCED_BUMP:+--bump "$FORCED_BUMP"} >> "$GITHUB_OUTPUT"

  dist:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Stamp the release version (not committed)
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python .github/scripts/stamp_version.py "$VERSION"
      - name: Stamp the build (date and commit shown in the app)
        shell: bash
        run: printf 'DATE = "%s"\nCOMMIT = "%s"\n' "$(git log -1 --format=%cd --date=format:%d%m%Y)" "$(git rev-parse --short HEAD)" > src/mitoolkit/_build.py
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  executables:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, tag: windows-x64, ext: .exe, mode: --windowed, extra: --version-file packaging/version_info.txt}
          - {os: ubuntu-24.04,  tag: linux-x64,   ext: "", mode: --console}
          - {os: macos-latest,   tag: macos-arm64, ext: "", mode: --console}
    runs-on: ${{ matrix.os }}
    env:
      # Optional code-signing certificate (a .pfx, base64) in the repository secrets. Without it the
      # Windows program is built unsigned and Windows SmartScreen will warn about it.
      CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Stamp the release version (not committed)
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python .github/scripts/stamp_version.py "$VERSION"
      - name: Stamp the build (date and commit shown in the app)
        shell: bash
        run: printf 'DATE = "%s"\nCOMMIT = "%s"\n' "$(git log -1 --format=%cd --date=format:%d%m%Y)" "$(git rev-parse --short HEAD)" > src/mitoolkit/_build.py
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install
        run: python -m pip install . pyinstaller
      - name: Windows version information (shown in the file's properties)
        if: runner.os == 'Windows'
        shell: bash
        run: python packaging/make_version_file.py > packaging/version_info.txt
      - name: Build
        run: pyinstaller --onefile ${{ matrix.mode }} ${{ matrix.extra }} --name mitoolkit --icon assets/icon.ico --collect-data mitoolkit --collect-all libusb_package --hidden-import usb.backend.libusb1 --hidden-import PIL._tkinter_finder packaging/app.py
      - name: Sign the Windows program (when a certificate is configured)
        if: runner.os == 'Windows' && env.CERT != ''
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "mitoolkit" dist\mitoolkit.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          & $signtool verify /pa dist\mitoolkit.exe
          if ($LASTEXITCODE -ne 0) { throw "signature check failed" }
          Remove-Item cert.pfx
      - name: Smoke test
        shell: bash
        run: |
          ./dist/mitoolkit${{ matrix.ext }} --version
          if ./dist/mitoolkit${{ matrix.ext }} unlock; then echo "gate failed"; exit 1; fi
      - name: Name artifacts
        shell: bash
        run: |
          mkdir out
          cp dist/mitoolkit${{ matrix.ext }}     out/mitoolkit-${{ matrix.tag }}${{ matrix.ext }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exe-${{ matrix.tag }}
          path: out/*

  publish:
    needs: [check, dist, executables]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only this job may create the release
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums (the in-app updater checks downloads against this file)
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes (what was merged comes from GitHub; this adds how to download)
        env:
          BUMP: ${{ needs.check.outputs.bump }}
        run: |
          {
            echo "A ${BUMP} release, made automatically from the pull requests merged since the last one."
            echo
            echo "### Downloads"
            echo "- \`mitoolkit-*\` program for Windows, Linux and macOS: opens the GUI, or runs on the command line with \`--cli\`. The app updates itself from here (Help > Check for updates)."
            echo "- \`.whl\` / \`.tar.gz\`: Python packages (\`pip install <file>\`)"
            echo "- \`SHA256SUMS.txt\`: verify downloads with \`sha256sum -c SHA256SUMS.txt\`"
            echo
            echo "Windows SmartScreen and macOS Gatekeeper may warn about a program they have not seen before (more so if it is not code-signed). Check the download against SHA256SUMS.txt, then choose More info > Run anyway on Windows. Updating from inside the app does not trigger the warning."
            echo "Antivirus tools sometimes flag PyInstaller programs. If you prefer, install from source."
            echo "Unlocking erases the device: read docs/safety.md first."
          } >> notes.md
          cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" artifacts/* --title "$TAG" --notes-file notes.md --generate-notes --latest --target "$GITHUB_SHA"

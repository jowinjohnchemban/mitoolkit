name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Imports
        run: python -c "import miunlock.api, miunlock.cli, miunlock.gui, miunlock.auth, miunlock.adb_usb, miunlock.fastboot_usb, miunlock.usbio, miunlock.xiaomi, miunlock.ui.apps_dialog, miunlock.ui.backup_dialog, miunlock.ui.guide_window"
      - name: Version
        run: miunlock --version
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Unlock refuses without --confirm-wipe
        shell: python
        run: |
          import json, subprocess, sys
          r = subprocess.run(["miunlock", "unlock"], capture_output=True, text=True)
          assert r.returncode == 1, f"expected exit 1, got {r.returncode}"
          out = json.loads(r.stdout)
          assert out["success"] is False and "--confirm-wipe" in out["error"], out
          print("gate OK")

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Imports
        run: python -c "import miunlock.api, miunlock.cli, miunlock.gui, miunlock.auth"
      - name: Version
        run: miunlock --version
      - name: Unlock refuses without --confirm-wipe
        shell: python
        run: |
          import json, subprocess, sys
          r = subprocess.run(["miunlock", "unlock"], capture_output=True, text=True)
          assert r.returncode == 1, f"expected exit 1, got {r.returncode}"
          out = json.loads(r.stdout)
          assert out["success"] is False and "--confirm-wipe" in out["error"], out
          print("gate OK")

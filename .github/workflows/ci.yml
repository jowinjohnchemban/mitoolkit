name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Imports
        run: python -c "import mitoolkit.api, mitoolkit.cli, mitoolkit.gui, mitoolkit.auth, mitoolkit.adb_usb, mitoolkit.fastboot_usb, mitoolkit.usbio, mitoolkit.xiaomi, mitoolkit.ui.apps_dialog, mitoolkit.ui.backup_dialog, mitoolkit.ui.guide_window, mitoolkit.ui.activity_window, mitoolkit.ui.security_dialog, mitoolkit.security, mitoolkit.ui.components.scroll_page, mitoolkit.ui.components.charts, mitoolkit.ui.components.buttons"
      - name: Version
        run: mitoolkit --version
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Unlock refuses without --confirm-wipe
        shell: python
        run: |
          import json, subprocess, sys
          r = subprocess.run(["mitoolkit", "unlock"], capture_output=True, text=True)
          assert r.returncode == 1, f"expected exit 1, got {r.returncode}"
          out = json.loads(r.stdout)
          assert out["success"] is False and "--confirm-wipe" in out["error"], out
          print("gate OK")

  # The Release workflow only runs when a version is published, so an update of the artifact actions could
  # break it unnoticed. This job does the same upload-then-download-and-merge on every change.
  artifacts:
    name: Artifact round trip
    runs-on: ubuntu-24.04
    steps:
      - name: Make two files, as two jobs would
        run: |
          mkdir out-a out-b
          echo a > out-a/a.txt
          echo b > out-b/b.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-a
          path: out-a/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-b
          path: out-b/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: collected
          merge-multiple: true
      - name: Both files arrived in one folder
        run: |
          test -f collected/a.txt && test -f collected/b.txt
          cd collected && sha256sum *

  # One stable name for branch protection to require, however the matrix above changes.
  checks:
    name: CI passed
    if: always()
    needs: [test, artifacts]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job must have passed
        run: |
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.artifacts.result }}" = "success" ] || {
            echo "tests: ${{ needs.test.result }}, artifacts: ${{ needs.artifacts.result }}"; exit 1; }

[project]
version = "1.7.5"
name = "miunlock"
description = "Retrieve Xiaomi encryptData(token) to unlock bootloader"
authors = [{name = "offici5l"}]
license = "Apache-2.0"

keywords = ["xiaomi", "miunlock", "MiUnlockTool", "bootloader", "unlock", "MIUI", "HyperOS", "Tools"]


classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

requires-python = ">=3.7"

dependencies = [
    # migate is vendored directly into src/migate (sanitized: password-login
    # path removed, session file locked down) -- see CHANGES.md. Its own
    # upstream dependencies are listed here instead.
    "requests",
    "rich",
    "qrcode",
    "pyaes",
]

[project.urls]
Repository = "https://github.com/jowinjohnchemban/miunlock"

[project.scripts]
miunlock = "miunlock.cli:main"
miunlock-gui = "miunlock.gui:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
migate = ["login/captcha.html"]

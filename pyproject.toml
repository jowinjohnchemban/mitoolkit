[project]
name = "miunlock"
dynamic = ["version"]
description = "Retrieve Xiaomi encryptData(token) to unlock bootloader"
authors = [{name = "Jowin John Chemban"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

keywords = ["xiaomi", "miunlock", "bootloader", "unlock", "MIUI", "HyperOS", "Tools"]


classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

requires-python = ">=3.9"

dependencies = [
    # What the Xiaomi login code in miunlock.auth needs (see docs/safety.md).
    "requests",
    "rich",
    "qrcode",
    "pyaes",
    # Anti-aliased, high resolution charts and gauges in the GUI (the GUI still works without it).
    "Pillow>=10",
    # Built-in adb and fastboot talk to the phone over USB through libusb.
    "pyusb>=1.2.1",
    # Ships the libusb library itself; elsewhere install libusb from the system's packages.
    'libusb-package; sys_platform == "win32" or sys_platform == "darwin" or (sys_platform == "linux" and platform_machine == "x86_64")',
]

[project.optional-dependencies]
# Store the session in the OS credential store (macOS Keychain, Linux Secret Service).
secure = ["keyring>=24"]

[project.urls]
Repository = "https://github.com/jowinjohnchemban/miunlock"

[project.scripts]
miunlock = "miunlock.cli:main"
miunlock-gui = "miunlock.gui:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miunlock = ["assets/*.png"]
"miunlock.auth.login" = ["captcha.html"]

[tool.setuptools.dynamic]
version = {attr = "miunlock.__version__"}

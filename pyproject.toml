[project]
name = "miunlock"
dynamic = ["version"]
description = "Retrieve Xiaomi encryptData(token) to unlock bootloader"
authors = [{name = "offici5l"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

keywords = ["xiaomi", "miunlock", "MiUnlockTool", "bootloader", "unlock", "MIUI", "HyperOS", "Tools"]


classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

requires-python = ">=3.9"

dependencies = [
    # The Xiaomi auth gateway (originally a separate "migate" package) is
    # merged into miunlock.auth as part of this single codebase (sanitized:
    # password-login path removed, session file locked down) -- see
    # docs/safety.md. Its own upstream dependencies are listed here instead.
    "requests",
    "rich",
    "qrcode",
    "pyaes",
]

[project.optional-dependencies]
# Store the session in the OS credential store (macOS Keychain, Linux Secret Service).
secure = ["keyring>=24"]

[project.urls]
Repository = "https://github.com/jowinjohnchemban/miunlock"

[project.scripts]
miunlock = "miunlock.cli:main"
miunlock-gui = "miunlock.gui:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miunlock = ["assets/*.png"]
"miunlock.auth.login" = ["captcha.html"]

[tool.setuptools.dynamic]
version = {attr = "miunlock.__version__"}
